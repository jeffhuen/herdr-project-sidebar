id = "herdr-project-sidebar"
name = "herdr-project-sidebar"
version = "0.1.0"
description = "Orca-style project sidebar for Herdr: collapsible project -> worktree -> agent tree."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "projects"
title = "Projects"
placement = "split"
command = ["./target/release/herdr-project-sidebar"]
platforms = ["linux", "macos"]

[[actions]]
id = "open-projects"
title = "Projects: open sidebar"
description = "Open the project sidebar in a right split (focus it if already open)."
command = ["bash", "scripts/open-projects.sh"]
platforms = ["linux", "macos"]

[[actions]]
id = "toggle-projects"
title = "Projects: toggle sidebar"
description = "Close the project sidebar if focused in this tab, otherwise open/focus it."
command = ["./target/release/herdr-project-sidebar", "--toggle"]
platforms = ["linux", "macos"]
