[package]
name = "herdr-project-sidebar"
version = "0.2.0"
edition = "2021"
description = "Project sidebar for Herdr: interactive terminal dock and native sidebar presentation."
license = "MIT"

[[bin]]
name = "herdr-project-sidebar"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.23"
