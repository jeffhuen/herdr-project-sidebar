[package]
name = "herdr-project-sidebar"
version = "0.1.0"
edition = "2021"
description = "Orca-style project sidebar for Herdr: collapsible project -> worktree -> agent tree, git-aware, event-driven."
license = "MIT"

[[bin]]
name = "herdr-project-sidebar"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
